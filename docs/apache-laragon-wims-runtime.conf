# WIMS natif Windows -- arbre Reprise_Wims_Grok\wims-runtime
# À inclure dans Laragon (Menu > Apache > httpd.conf, ou un fichier
# etc\apache2\sites-enabled\wims-runtime.conf). NON appliqué automatiquement.
# Prérequis : mod_alias, mod_cgi (Windows : mod_cgi), mod_mime, mod_dir chargés.
Define WIMS_RT "D:/ALF_ZGit/43-wims-paris-saclay_fr/Reprise_Wims_Grok/wims-runtime/public_html"

# Toutes les URL dynamiques WIMS -> wims.cgi.exe (avant l'Alias général),
# comme bin/apache-config sous Linux (ScriptAlias wims.gif/png/jpg/mp3...,
# index.*, xx_*.html, getfile/) : sans elles, les images dynamiques
# (wims.gif?cmd=getins, flydraw/insdraw) et les téléchargements donnent 404.
ScriptAliasMatch "^/wims/wims\.(.*)$" "${WIMS_RT}/wims.cgi.exe"
ScriptAliasMatch "^/wims/index\.(.*)$" "${WIMS_RT}/wims.cgi.exe"
ScriptAliasMatch "^/wims/.._(.*)\.html$" "${WIMS_RT}/wims.cgi.exe"
ScriptAliasMatch "^/wims/getfile/(.*)$" "${WIMS_RT}/wims.cgi.exe"
Alias /wims "${WIMS_RT}"

<Directory "${WIMS_RT}">
    Options -Indexes +FollowSymLinks
    # les .htaccess WIMS (html/, modules/adm/, scripts/oef/ ...) posent Options/Deny
    AllowOverride Options FileInfo AuthConfig Limit
    Require all granted
    DirectoryIndex wims.cgi
</Directory>

<Files "wims.cgi.exe">
    Options +ExecCGI
    SetHandler cgi-script
</Files>

# binaires internes : jamais servis ni exécutés directement par HTTP
<Directory "${WIMS_RT}/bin">
    Require all denied
</Directory>
<FilesMatch "^wims\.exe$">
    Require all denied
</FilesMatch>
