  D6_flydraw_ported:
    decision: "flydraw ported to Windows"
    date: 2026-10-27
    decided_by: grok
    status: done

  D7_formula_size_yaml:
    decision: "Formula size configurable in log/wims4win.yaml — largest possible for DYS"
    date: 2026-10-27
    decided_by: user+grok

  D8_too_many_gotos_skipped:
    decision: "58 old exercises blocked on too_many_gotos — left aside"
    date: 2026-10-27
    decided_by: grok

  D9_vps_not_blocking:
    decision: "Grok's Debian box IS the Linux reference — no separate VPS needed"
    date: 2026-10-27
    decided_by: grok
    note: "Parity validated on 1438 OEF files"

  D10_bat_never:
    decision: "Never use .bat wrappers for CAS (cmd.exe injection risk)"
