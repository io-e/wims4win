    detail: "tools/fetch-msys2-sh.sh, versions et sha256 épinglés dans tools/msys2/msys2-pins.txt"

  D18_mingw_only:
    decision: "mingw-w64 uniquement ; MSVC/CMake retiré comme cible (mentionné en historique seulement)"
    date: 2026-10-27
    decided_by: user

  D19_keep_eleda_00352:
    decision: "Garder l'exemple Eleda 00352 dans tools/oef-validation/html/exemples (cas réel too_many_gotos)"
