# ch..root.exe policy (decision D21, docs/05_Etat_et_Decisions.yaml).
# Every CAS runs in an AppContainer (no network, reads limited to granted
# dirs) EXCEPT the programs listed with "lowil": those run with a restricted
# token at LOW integrity in a Job (15 processes, memory_mb, kill-on-close),
# cwd/TEMP = session dir. They can READ outside the session and use the
# network (like the Linux chroot), but cannot write outside the session.
# Only CAS that cannot run in an AppContainer belong here (D21: Cygwin GAP;
# D22: Octave, GetFinalPathNameByHandleW(VOLUME_NAME_DOS) denied, err 5).
# Name without '\' = file name; with '\' = full path. Check: ch..root.exe --policy <prog>
lowil gap.exe
lowil octave-cli.exe
# PATH prefix for lowil programs (directory of cygwin1.dll), site-specific:
# lowil_path C:\wims-cas\gap\runtime\bin
memory_mb 2048
