# 05_Etat_et_Decisions.yaml — état du projet et décisions (document consolidé)
# Consolidé le 2026-10-27 (heure de Paris) par Grok.
# Sources : archive/State_Wims4Win_CLAUDE_V1.yaml (Claude, base),
#           Suivi_Developpement_Portage.md et archive/Evaluation_OEF_wims4win.md (Grok),
#           état GitHub des issues (io-e/wims4win) au 2026-10-27.
# Règle : la vérité est le code et les résultats mesurés. Les décisions
# « decided_by: user » viennent uniquement de ce qu'Arnaud a dit.
# Claude et Grok mettent ce fichier à jour directement (plus de copie séparée).
# Repo: io-e/wims4win (private)

project:
  name: wims4win
  description: Native Windows port of WIMS 4.33a (r19040)
  repo: https://github.com/io-e/wims4win
  license: GPL-2.0
  created: 2026-10-23

team:
  claude:
    role: Architecture, audit, documentation, upstream reporting
    env: ShadowPC Windows 11 (no Docker/WSL2/Hyper-V)
  grok:
    role: Prototype code, cross-build, testing
    env: Box Debian de Grok (référence Linux ; pas de VPS séparé, cf. D9)
  user:
    role: Decision maker, project owner
    github: io-e

# ── Decisions (locked) ──────────────────────────────────────────────

decisions:
  D1_engine_version:
    decision: "WIMS 4.33a (trunk r19040) — no rebase on 4.31b"
    date: 2026-10-25
    decided_by: user
    github_issue: "#4 — closed"

  D2_single_repo:
    decision: "Single private repo io-e/wims4win"
    date: 2026-10-23
    decided_by: user+grok

  D3_maxima_sbcl_direct:
    decision: "Launch sbcl.exe --core directly, no maxima.bat, no cmd.exe"
    date: 2026-10-23
    decided_by: grok
    commit: 3c59829
    github_issue: "#2 — closed"

  D4_cpu_limit_at_spawn:
    decision: "CREATE_SUSPENDED → Job assign → ResumeThread + watchdog"
    date: 2026-10-23
    decided_by: grok
    commit: 5f5523b

  D5_load_test_out_of_scope:
    decision: "Load test (30 concurrent users) and parallel launches out of scope"
    date: 2026-10-27
    decided_by: user

  D6_flydraw_ported:
    decision: "flydraw ported to Windows"
    date: 2026-10-25
    decided_by: user (porté par grok)
    detail: "libgd 2.3.3 statique mingw, insdraw..processor.exe natif ; 00001 identique à Linux (GIF sha256)"
    limits: "animations = 1re image ; pas de texte TrueType (freetype) ; pas de conversion de format"
    status: done

  D7_formula_size_yaml:
    decision: "Formula size configurable in log/wims4win.yaml — largest possible for DYS"
    date: 2026-10-25
    detail: "formula.size 200% par défaut, plage 50-400% ; même comportement Linux/Windows ; corrige le bug argv amont --tex-size (110% vs 120%)"
    decided_by: user+grok

  D8_too_many_gotos_skipped:
    decision: "58 old exercises blocked on too_many_gotos — left aside"
    date: 2026-10-25
    decided_by: user
    note: "Exercices Eleda convertis par xml2oef (1100 des 1438 du corpus), non publiés"

  D9_vps_not_blocking:
    decision: "Grok's Debian box IS the Linux reference — no separate VPS needed"
    date: 2026-10-27
    decided_by: grok (issue #5 fermée)
    note: "Parity validated on 1438 OEF files"

  D10_bat_never:
    decision: "Never use .bat wrappers for CAS (cmd.exe injection risk)"
    date: 2026-10-23
    decided_by: claude+grok

  D11_appcontainer_no_capabilities:
    decision: "AppContainer without capability SIDs (no network, registry, clipboard)"
    date: 2026-10-23
    decided_by: claude

  D12_pari_branched:
    decision: "PARI/GP branché (pari_command dans wims-runtime et wims-runtime-oef)"
    date: 2026-10-25
    decided_by: user
    note: "00403 identique à Linux"

  D13_oef_tools_in_repo:
    decision: "Outil de test OEF d'OEF_VALIDATION dans un dossier à part : tools/oef-validation/"
    date: 2026-10-25
    decided_by: user
    note: ".exe, zip, runtime, corpus Eleda et oef_validate.py (validateur d'Arnaud) non publiés"

  D14_docs_merged:
    decision: "Documents Claude + Grok intégrés au dépôt puis fusionnés en documents uniques dans docs/"
    date: 2026-10-27
    decided_by: user
    note: "Originaux dans docs/archive/ ; Claude écrit directement dans les documents consolidés"

  D15_runtime_from_svn:
    decision: "Runtime (public_html, modules, scripts) reconstruit depuis SVN trunk r19040, pour correspondre au moteur 4.33a"
    date: 2026-10-27
    decided_by: user
    github_issue: "#3"

  D16_modules_source:
    decision: "Modules : base initiale depuis SVN r19040, puis modupdate (via sh.exe) pour les mises à jour ; pas de paquets Debian"
    date: 2026-10-27
    decided_by: user

  D17_msys2_sh_bundled:
    decision: "sh.exe MSYS2 + coreutils embarqués dans other/bin/ ; scripts .sh non réécrits (oefcompile, mkindex, backup, modupdate…) ; jamais cmd.exe ni .bat"
